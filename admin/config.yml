# Admin page for nilotpaldesign.com (Decap CMS)
# Everything you edit here is saved to the content/ folder in the GitHub repo,
# and GitHub Pages republishes the site automatically (about a minute).
# Login still goes through Netlify's free GitHub sign-in service (site: nilotpaldesign.netlify.app).

backend:
  name: github
  repo: nilotpalsarkar03-boop/portfolio
  branch: main
  base_url: https://api.netlify.com
  site_domain: nilotpaldesign.netlify.app
  commit_messages:
    update: "Content: update {{slug}} (via admin)"
    uploadMedia: "Upload {{path}} (via admin)"
    deleteMedia: "Delete {{path}} (via admin)"

site_url: https://nilotpaldesign.com
display_url: https://nilotpaldesign.com
logo_url: /assets/logo.png

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: website
    label: Website
    editor:
      preview: false
    files:
      - name: projects
        label: Projects
        file: content/projects.json
        fields:
          - label: Projects (the first one is the big featured project; drag to reorder)
            name: projects
            widget: list
            max: 6
            summary: "{{fields.title}} — {{fields.year}}"
            collapsed: true
            fields:
              - { label: Show on website, name: visible, widget: boolean, default: true }
              - { label: Title, name: title, widget: string, hint: "Wrap words in *stars* to colour them pink, e.g. */Oral_Care* is very important" }
              - { label: Client, name: client, widget: string, required: false, hint: "e.g. Freelance, CIT Kokrajhar, Personal" }
              - { label: Year, name: year, widget: string, default: "2026" }
              - { label: Your role, name: role, widget: string, required: false, hint: "e.g. UX research, UI design, frontend" }
              - { label: Tags, name: tags, widget: list, allow_add: true, hint: "Up to 3 short tags, separated by commas", required: false }
              - { label: Short summary (1–2 sentences), name: summary, widget: text }
              - { label: Cover image (For general view), name: cover, widget: image, required: false, hint: "Shown in the tilted sticker (first project) and the hover preview of the list" }
              - { label: Card image (For designers view), name: card_image, widget: image, required: false, hint: "Wide photo for the big project card, about 1600 × 1000 px" }
              - { label: Card image label, name: card_label, widget: string, required: false, hint: "Tiny pink label at the bottom of the card photo, e.g. Land planning" }
              - { label: Handwritten note (optional), name: note, widget: string, required: false, hint: "Shown next to the featured project, e.g. 'my favourite'" }
              - { label: Case study link (optional), name: link, widget: string, required: false, hint: "A Behance / Figma / PDF link until case-study pages are ready" }

      - name: stickers
        label: Playground stickers
        file: content/stickers.json
        fields:
          - { label: Full sheet (A4 PDF), name: full_sheet, widget: file, required: false, hint: "The '↓ Full sheet · A4 PDF' button downloads this file" }
          - label: Stickers (drag to reorder — this is the order on the Playground page)
            name: stickers
            widget: list
            summary: "{{fields.name}} — {{fields.status}}"
            collapsed: true
            fields:
              - { label: Show on website, name: visible, widget: boolean, default: true }
              - { label: Sticker name, name: name, widget: string, hint: "Shown as STICKER / NAME / YEAR" }
              - { label: Year, name: year, widget: string, default: "2026" }
              - { label: Sticker image, name: image, widget: image, required: false, hint: "PNG with a transparent background works best (about 1000 × 1000 px). Leave empty to show a blank placeholder." }
              - { label: Download file (optional), name: download, widget: file, required: false, hint: "High-res PNG or print-ready PDF. If empty, visitors download the sticker image above." }
              - { label: Print size, name: size, widget: string, default: "5 cm", hint: "Shown on hover, e.g. ↓ PNG · 5 cm" }
              - { label: Category (filter chip), name: category, widget: select, default: bengali, options: [{ label: Bengali, value: bengali }, { label: Tech, value: tech }, { label: Doodles, value: doodles }] }
              - { label: Shape, name: shape, widget: select, default: round, options: [{ label: Round, value: round }, { label: Rounded square, value: square }] }
              - label: Status
                name: status
                widget: select
                default: available
                options:
                  - { label: "Available to download", value: available }
                  - { label: "Coming soon", value: soon }

      - name: youtube
        label: YouTube videos
        file: content/youtube.json
        fields:
          - { label: Show YouTube section on website, name: show_section, widget: boolean, default: true }
          - { label: Channel link, name: channel_url, widget: string, required: false, hint: "e.g. https://www.youtube.com/@yourname — used by the Subscribe stamp and 'All videos'" }
          - { label: Channel handle, name: channel_handle, widget: string, required: false, hint: "e.g. @yourname — shown on the Subscribe stamp" }
          - label: Videos (the FIRST one is the big featured video; drag to change the order)
            name: videos
            widget: list
            max: 4
            summary: "{{fields.title}} {{fields.link}}"
            collapsed: true
            fields:
              - { label: Show on website, name: visible, widget: boolean, default: true }
              - { label: YouTube video link, name: link, widget: string, hint: "Paste the video's link, e.g. https://youtu.be/abc123 or https://www.youtube.com/watch?v=abc123" }
              - { label: Title (optional), name: title, widget: string, required: false, hint: "Leave empty to use the title from YouTube automatically" }
              - { label: Short description (featured video only, optional), name: description, widget: text, required: false }
              - { label: Episode / date label (optional), name: meta, widget: string, required: false, hint: "e.g. EP 03 · MAR 2026" }
              - { label: Length (optional), name: duration, widget: string, required: false, hint: "e.g. 12:34 — shown on the thumbnail" }
              - { label: Custom thumbnail (optional), name: thumbnail, widget: image, required: false, hint: "Leave empty to use the video's own YouTube thumbnail" }

      - name: about
        label: About & status
        file: content/about.json
        fields:
          - { label: Open to work, name: open_to_work, widget: boolean, default: true }
          - { label: Hero bio (under 'portfolio'), name: hero_bio, widget: text }
          - { label: About heading, name: about_heading, widget: string, default: "Hi, I’m Nilotpal." }
          - { label: About intro (larger text), name: about_lead, widget: text }
          - { label: About body, name: about_body, widget: text }
          - label: Now / Open to
            name: now
            widget: list
            fields:
              - { label: Label, name: label, widget: string, hint: "Now / Open to" }
              - { label: Text, name: text, widget: string }

      - name: links
        label: Links & résumé
        file: content/links.json
        fields:
          - { label: Email, name: email, widget: string }
          - { label: LinkedIn URL, name: linkedin, widget: string, required: false }
          - { label: Behance URL, name: behance, widget: string, required: false }
          - { label: GitHub URL, name: github, widget: string, required: false }
          - { label: Instagram URL, name: instagram, widget: string, required: false }
          - { label: Résumé PDF, name: resume, widget: file, required: false, media_library: { config: { multiple: false } } }
